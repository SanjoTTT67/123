<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform and Transitions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style="margin-bottom: 15%;">CSS Transform and Transitions</h1>

    <div class="row">
        <b style="margin-right: 40px;">Translate</b>
        <div style="margin-right: 20px;" class="box">Before</div>
        <span style="margin-right: 20px;">-></span>
        <div class="box translate">After</div>
    </div>

    <div class="row">
        <b style="margin-right: 60px;">Rotate</b>
        <div style="margin-right: 20px;" class="box">Before</div>
        <span style="margin-right: 20px;">-></span>
        <div class="box rotate">After</div>
    </div>

    <div class="row">
        <b style="margin-right: 67px;">Scale</b>
        <div style="margin-right: 20px;" class="box">Before</div>
        <span style="margin-right: 20px;">-></span>
        <div class="box scale">After</div>
        </div>

    <div class="row">
        <b style="margin-right: 67px;">Skew</b>
        <div style="margin-right: 20px;" class="box">Before</div>
        <span style="margin-right: 20px;">-></span>
        <div class="box skew">After</div>
    </div>


</body>
</html>
